worker_processes auto;
events { worker_connections 4096; }

http {
  client_max_body_size 512m;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  send_timeout 600s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Mesmas rotas do Supabase => frontend não muda, só a URL base.
  server {
    listen 8000;
    server_name _;

    location = /health { return 200 'ok'; add_header Content-Type text/plain; }

    location /auth/v1/ {
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass http://auth:9999;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/v1/ {
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass http://rest:3000;
      proxy_set_header Host $host;
      proxy_set_header Accept-Profile $http_accept_profile;
      proxy_set_header Content-Profile $http_content_profile;
    }

    location /realtime/v1/ {
      rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
      proxy_pass http://realtime:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }

    location /storage/v1/ {
      rewrite ^/storage/v1/(.*)$ /$1 break;
      proxy_pass http://storage:5000;
      proxy_set_header Host $host;
    }

    location /functions/v1/ {
      rewrite ^/functions/v1/(.*)$ /$1 break;
      proxy_pass http://functions:9000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
